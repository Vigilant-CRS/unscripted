[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "unscripted"
version = "1.21.0"
description = "Engine-independent causal social-memory runtime for game NPCs"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
authors = [{name = "Vigilant e.K. (Damir Dulovic)", email = "info@vigilant-crs.de"}]
keywords = ["games", "npc", "simulation", "dialogue", "memory", "sdk"]
classifiers = [
  "License :: Other/Proprietary License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Games/Entertainment",
  "Topic :: Software Development :: Libraries",
]
dependencies = []

[project.urls]
Homepage = "https://vigilant-crs.github.io/unscripted/"
Source = "https://github.com/Vigilant-CRS/unscripted"
Issues = "https://github.com/Vigilant-CRS/unscripted/issues"

[project.scripts]
unscripted = "unscripted.cli:main"
unscripted-play = "unscripted.cli:main"

[tool.setuptools]
packages = ["unscripted"]

[tool.setuptools.data-files]
"share/unscripted/worldpacks/market-square" = [
  "worldpacks/market-square/canon.json",
  "worldpacks/market-square/initial_state.json",
  "worldpacks/market-square/scenario.json",
  "worldpacks/market-square/topics.json",
  "worldpacks/market-square/world.json",
]
"share/unscripted/worldpacks/market-square/characters" = [
  "worldpacks/market-square/characters/bran.json",
  "worldpacks/market-square/characters/dale.json",
  "worldpacks/market-square/characters/nadia.json",
  "worldpacks/market-square/characters/otto.json",
  "worldpacks/market-square/characters/sela.json",
  "worldpacks/market-square/characters/tomas.json",
  "worldpacks/market-square/characters/yara.json",
]
# The reusable addon, as opposed to the demo project: a studio drops this into
# its own game and never writes process management for the runtime.
# The Unity package: same two components as the Godot addon, in C#.
# Automation tests that run INSIDE Unreal, against a live service. Shipped with
# the plugin because a studio evaluating it should be able to run them.
"share/unscripted/integrations/unreal/UnscriptedBridge/Source/UnscriptedBridge/Private/Tests" = [
  "integrations/unreal/UnscriptedBridge/Source/UnscriptedBridge/Private/Tests/UnscriptedBridgeTests.cpp",
]
"share/unscripted/integrations/unity/com.vigilant.unscripted" = [
  "integrations/unity/com.vigilant.unscripted/package.json",
  "integrations/unity/com.vigilant.unscripted/README.md",
]
# The behavioural tests. Shipped with the package because a studio evaluating it
# should be able to run them against its own service.
"share/unscripted/integrations/unity/com.vigilant.unscripted/Tests/Runtime" = [
  "integrations/unity/com.vigilant.unscripted/Tests/Runtime/UnscriptedClientTests.cs",
  "integrations/unity/com.vigilant.unscripted/Tests/Runtime/Vigilant.Unscripted.Tests.asmdef",
]
"share/unscripted/integrations/unity/com.vigilant.unscripted/Runtime" = [
  "integrations/unity/com.vigilant.unscripted/Runtime/UnscriptedHost.cs",
  "integrations/unity/com.vigilant.unscripted/Runtime/UnscriptedClient.cs",
  "integrations/unity/com.vigilant.unscripted/Runtime/Vigilant.Unscripted.asmdef",
]
"share/unscripted/integrations/godot/addons/unscripted" = [
  "integrations/godot/addons/unscripted/UnscriptedHost.gd",
  "integrations/godot/addons/unscripted/UnscriptedClient.gd",
]
