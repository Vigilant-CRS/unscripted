name: Showcase pages

# The public pages are generated by running the runtime, never written by hand,
# and rebuilt on every push to main. A marketing page that quotes a number the
# code no longer produces is worse than no page: the first person to check it is
# the technical lead deciding whether to take the call.
#
# One-time setup: repository Settings -> Pages -> Source: GitHub Actions.

# WHAT REBUILDS THE SITE, and what does not.
#
# This job installs ffmpeg and espeak-ng, renders frames through headless
# Chrome and assembles a film. That is minutes of runner time, and it was
# running on every push -- including a run of pushes that changed only the C++
# port, the tests and this repository's prose, none of which the site is
# generated from.
#
# So it rebuilds when something that FEEDS the pages changes: the runtime, the
# world packs, this workflow. A README edit or a change under `port/` does not
# reach the generated pages, and `workflow_dispatch` is there for the case where
# that judgement is wrong.
on:
  push:
    branches: [main]
    paths:
      - "unscripted/**"
      - "worldpacks/**"
      - "conformance/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never two deploys at once; never cancel one that is mid-flight.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the runtime itself, with no third-party dependencies
        run: python -m pip install -e . --no-deps

      - name: Tools the film needs
        # Chrome is preinstalled on the runner image and renders the frames --
        # there is no display to record. ffmpeg assembles them; espeak-ng speaks
        # the narration.
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg espeak-ng

      - name: Build the showcase
        run: python -m unscripted pages --out _site --with-film --quiet

      - name: Assert the pages are self-contained
        # A page that fetches anything at all stops working the moment it is
        # opened from a file:// URL, in an offline conference room, or in an
        # email client -- which are three of the four places it will be opened.
        # So what is refused is what a page could LOAD. A link the reader may
        # follow loads nothing; this check used to refuse every href to another
        # site, which would have refused the link to the video and the source.
        run: |
          cd _site
          for page in index.html rumour.html spread.html lie.html compare.html start.html tour.html; do
            test -s "$page" || { echo "missing or empty: $page"; exit 1; }
            if grep -qE 'src=.https?:|<link[^>]*href=.https?:|@import|XMLHttpRequest|fetch\(|WebSocket' "$page"; then
              echo "$page reaches outside itself"; exit 1
            fi
          done
          test -s film.mp4 || { echo "the film did not build"; exit 1; }
          echo "7 pages and a film, none of them fetching anything external"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
